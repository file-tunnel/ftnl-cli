name: secrets-audit

# Fail-closed, key-independent check that no plaintext secret can reach this
# repository. The CI lane deliberately does not install an age identity or the
# ores-sops runtime: it validates tracked paths, ignore rules, ciphertext
# structure, MAC presence, and recipient redundancy without decrypting values.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run key-independent environment audit
        run: bash .github/scripts/key-independent-env-audit.sh
