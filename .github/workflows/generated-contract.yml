name: generated-contract

on:
  push:
    branches: [main]
    paths:
      - '.cli-flags.toml'
      - 'src/cli_config.rs'
      - 'scripts/freeze-generated.sh'
      - '.github/workflows/generated-contract.yml'
  pull_request:
    paths:
      - '.cli-flags.toml'
      - 'src/cli_config.rs'
      - 'scripts/freeze-generated.sh'
      - '.github/workflows/generated-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frozen flags2env output
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reapply and verify the frozen generated-source policy
        run: |
          scripts/freeze-generated.sh --freeze
          scripts/freeze-generated.sh --check
