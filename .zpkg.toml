[package]
org = "file-tunnel"
name = "ftnl-cli"
version = "0.1.0"
description = "Command-line client for File Tunnel — create tunnels, send and receive files across devices"
license = "MIT"
keywords = ["cli", "file-transfer", "tunnel", "rust", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/file-tunnel/ftnl-cli"

# Org dependency graph: interfaces (wire shapes) -> clients (transport) -> this
# CLI. The org segment is the GitHub org that owns each repo. file-tunnel has no
# `ftnl-lib`; when one lands, it belongs between these two.
# scripts/check-zed-dependencies.py fails CI if this list and Cargo.toml disagree.
[dependencies]
"file-tunnel/ftnl-interfaces" = "^0.1.0"
"file-tunnel/ftnl-clients" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin ftnl"
outputs = ["target/release/ftnl"]

[bin]
ftnl = "target/release/ftnl"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/ftnl\" && \"$ZED_PKG_TEST_TARGET/target/release/ftnl\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"
lint = "cargo clippy --all-targets --locked -- -D warnings"
check-deps = "python3 scripts/check-zed-dependencies.py"
